# Codespaces поднимает два контейнера: app (наш код и .NET 10) и db (PostgreSQL).
services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # app живёт в сети контейнера db, поэтому база доступна как localhost:5432,
    # и строка подключения из appsettings.json работает без изменений
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # данные базы лежат в отдельном томе и не пропадают при остановке Codespace
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
